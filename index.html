<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Music Player</title>
<style>
/* Reset */
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    /* Updated gradient to reflect Spotify's colors */
    background: linear-gradient(135deg, #1DB954, #191414);
    color: #fff;
    padding: 20px; 
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: hidden; 
}

/* Header */
.header {
    line-height: 1.2;
    margin-bottom: 15px;
}

.header h1 {
    font-size: 2.2em;
    /* Spotify Green */
    background: #1ED760; 
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

.header h2 {
    font-size: 0.75em; 
    color: #eee;
    font-weight: 300;
    margin-top: 5px;
}

/* Search container */
#search-container {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

#searchBox, #searchButton {
    border:none;
    outline:none;
    color: #333;
    background-color: white;
}

#searchBox {
    width: 60%;
    padding: 12px 15px;
    border-radius: 25px;
    font-size: 16px;
}

#searchButton {
    padding: 12px 15px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s;
}

#searchButton:hover { background-color: #eee; }

/* Results Container - Scrollable, Fixed Height */
#results {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 2px;
    margin-bottom: 8px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    
    max-height: 250px; 
    overflow-y: auto; 
    padding-right: 5px;
    background: rgba(0,0,0,0.1); 
    border-radius: 5px;
}

/* Song card */
.song-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(5px);
    border-radius: 5px;
    width: 100%;
    padding: 8px 15px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 54px;
    flex-shrink: 0;
}
.song-card:hover {
    transform: none;
    background: rgba(255,255,255,0.25);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.song-card img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 0;
    flex-shrink: 0;
}

.song-info { flex-grow: 1; overflow: hidden; white-space: nowrap; }
.song-card h3 { font-size: 1em; margin-bottom: 0; overflow: hidden; text-overflow: ellipsis; }
.song-card p { font-size: 0.8em; color: #ccc; overflow: hidden; text-overflow: ellipsis; }

/* Details section (The Player Container) */
#details {
    margin-top: 8px;
    background: rgba(0,0,0,0.3);
    border-radius:15px;
    padding:15px 20px; 
    display:none;
    max-width: 800px; 
    margin-left:auto;
    margin-right:auto;
    transition: all 0.3s ease;
    margin-bottom: 0;
}

/* Reduced image margin */
#details img {
    width:150px;
    height:150px;
    border-radius:15px;
    object-fit:cover;
    display:block;
    margin:auto;
    margin-bottom: 10px;
    transition: transform 0.3s;
}
#details img:hover { transform: scale(1.05); }

#details h2 { text-align:center; margin-bottom:5px; }
#details p { text-align:center; margin-bottom:10px; font-size:0.95em; color:#ddd; }
#details audio { width:100%; margin-bottom: 0; }

/* Play Button (Replaced Download) */
#playContainer {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.play-btn {
    padding:10px 20px; 
    border:none;
    border-radius:25px;
    background: #1ED760; /* Spotify Green */
    color:white;
    font-size: 1em;
    font-weight: bold;
    cursor:pointer;
    transition:0.3s;
}
.play-btn:hover { background:#16a44b; }

/* Responsive */
@media(max-width:900px){
    #results, #details { max-width: 90%; } 
}
@media(max-width:768px){
    #searchBox { width:70%; }
}
@media(max-width:480px){
    #searchBox { width:80%; }
    .song-card { width:100%; }
}
</style>
</head>
<body>

<div class="header">
    <h1>SPOTIFY MUSIC PLAYER</h1>
    <h2>Music streamed via Spotify Web API - Only 30-second previews available.</h2>
</div>

<div id="search-container">
    <input type="text" id="searchBox" placeholder="Search for a song...">
    <button id="searchButton">🔎</button>
</div>

<div id="results"></div>

<div id="details">
    <img id="detail-img" src="" alt="Album Art">
    <h2 id="detail-title"></h2>
    <p id="detail-artist"></p>
    <audio id="player" controls></audio> 
    <div id="playContainer">
        <button id="preview-btn" class="play-btn" onclick="playPreview()">Play 30s Preview</button>
        <p style="font-size: 0.8em; margin-top: 10px; color: #ddd;">*Download functionality removed to comply with Spotify's Developer Terms of Service.</p>
    </div>
</div>

<script>
// ===============================================
// === 🛑 SPOTIFY API CREDENTIALS - IMPORTANT 🛑 ===
// ===============================================
const clientId = "ae9ffb867bbb41d5a3bef5908683329e";     // <--- PASTE YOUR CLIENT ID HERE
const clientSecret = "0684d65d11bc4d85a2f4e0b62b8f65c4"; // <--- PASTE YOUR CLIENT SECRET HERE
// ===============================================

const searchButton = document.getElementById('searchButton');
const searchBox = document.getElementById('searchBox');
const resultsDiv = document.getElementById('results');
const detailsDiv = document.getElementById('details');
const detailImg = document.getElementById('detail-img');
const detailTitle = document.getElementById('detail-title');
const detailArtist = document.getElementById('detail-artist');
const player = document.getElementById('player');
const playContainer = document.getElementById('playContainer');

let accessToken = ''; // Global variable for the access token
let currentTrackPreviewUrl = ''; // Global variable for the selected track's preview URL

searchButton.addEventListener('click', searchSong);
searchBox.addEventListener('keypress', e => { if(e.key==='Enter') searchSong(); });


// 1. GET ACCESS TOKEN (Client Credentials Flow)
async function getAccessToken(){
    const authString = btoa(`${clientId}:${clientSecret}`);
    const tokenUrl = 'https://accounts.spotify.com/api/token';

    try {
        const response = await fetch(tokenUrl, {
            method: 'POST',
            headers: {
                'Authorization': `Basic ${authString}`,
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'grant_type=client_credentials'
        });

        const data = await response.json();
        accessToken = data.access_token;
        // Spotify tokens expire after 1 hour (3600 seconds).
        // For a full app, you would add logic to refresh the token.
        return accessToken; 

    } catch (err) {
        console.error("Error fetching access token:", err);
        resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px; color: #f00;'>Authentication Error. Check Client ID/Secret.</p>";
        return null;
    }
}


// 2. SEARCH SONG
async function searchSong(){
    const query = searchBox.value.trim();
    if(!query) return alert("Please enter a song name!");

    resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px;'>Loading...</p>";
    detailsDiv.style.display = 'none';

    if (!accessToken) {
        if (!await getAccessToken()) return;
    }

    const searchUrl = `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=12`;

    try{
        const response = await fetch(searchUrl, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${accessToken}`
            }
        });
        
        // Handle token expiration: if 401, try to refresh and re-search
        if (response.status === 401) {
             if (!await getAccessToken()) return; // Re-fetch token
             // Re-try search
             const retryResponse = await fetch(searchUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });
            return processSearchResults(await retryResponse.json());

        } else if (!response.ok) {
            throw new Error(`Spotify API error: ${response.status}`);
        }

        const data = await response.json();
        processSearchResults(data);

    }catch(err){
        console.error(err);
        resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px; color: #f00;'>Error fetching songs.</p>";
    }
}

function processSearchResults(data) {
    resultsDiv.innerHTML = "";
    const tracks = data.tracks.items;

    if(tracks.length === 0){
        resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px;'>No songs found.</p>";
        return;
    }

    tracks.forEach(track => {
        // Get the largest image for the card, or a placeholder if none
        const albumImage = track.album.images.length > 0 ? track.album.images[track.album.images.length - 1].url : 'placeholder.png';
        const artistName = track.artists.map(artist => artist.name).join(', ');

        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
            <img src="${albumImage}" alt="Album Art">
            <div class="song-info">
                <h3>${track.name}</h3>
                <p>${artistName}</p>
            </div>
        `;
        card.onclick = () => showDetails(track, artistName);
        resultsDiv.appendChild(card);
    });
}


// 3. SHOW DETAILS & SET PLAYER SOURCE
function showDetails(track, artistName){
    // Get the medium image for the details section
    const albumImage = track.album.images.length > 1 ? track.album.images[1].url : 'placeholder.png'; 

    detailImg.src = albumImage;
    detailTitle.textContent = track.name;
    detailArtist.textContent = "Artist: " + artistName;
    
    // Set the global variable for the 30s preview stream URL
    currentTrackPreviewUrl = track.preview_url;

    // Reset and hide the default audio controls to use the custom button
    player.src = '';
    player.pause(); 
    player.controls = false; 

    // Show the details section
    detailsDiv.style.display = 'block';
}

// 4. PLAY PREVIEW
function playPreview() {
    if (!currentTrackPreviewUrl) {
        alert("Sorry, no 30-second preview stream is available for this track.");
        player.controls = false; 
        return;
    }

    // Set the source and show controls for playback
    player.src = currentTrackPreviewUrl;
    player.controls = true; 
    player.play();
}

// Initial token check (optional but good practice)
getAccessToken();
</script>

</body>
</html>
