<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Checker</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f7fb;
}

/* credits */
.credit{
  position:fixed;
  top:10px;
  left:15px;
  font-size:14px;
  color:#555;
}

/* input section */
.top-section{
  margin-top:25vh;
  text-align:center;
  padding:20px;
}

h2{ font-size:26px; }

input{
  width:85%;
  max-width:350px;
  padding:15px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:15px;
}

button{
  width:85%;
  max-width:350px;
  padding:15px;
  font-size:18px;
  margin-top:15px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:10px;
}

/* popup */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  width:80%;
  max-width:300px;
}

/* loading */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid #eee;
  border-top:5px solid #4CAF50;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:20px;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

.percent{
  margin-top:10px;
  font-weight:bold;
  font-size:18px;
}

/* share button */
.share-btn{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:400px;
  background:#2196F3;
}
</style>
</head>

<body>

<div class="credit">Credits - Juyel Hossain</div>

<div class="top-section">
  <h2>Enter Your Age</h2>
  <input type="number" id="age" placeholder="Enter age">
  <br>
  <button onclick="startProcess()">Process</button>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <h3 id="loadingText">Starting...</h3>
  <div class="percent" id="percent">0%</div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3 id="result"></h3>
    <button onclick="reset()">Test Again</button>
  </div>
</div>

<button class="share-btn" onclick="shareTool()">
Share the age testing tool with your friends
</button>

<script>
var texts = [
"Connecting to NASA servers .",
"Hacking government database .",
"Scanning your birth certificate .",
"Calculating quantum age .",
"Talking to time machine .",
"Verifying with aliens .",
"Almost done..."
];

function startProcess(){
  var age = document.getElementById("age").value;
  document.getElementById("loading").style.display="flex";

  let textIndex = 0;
  let percent = 0;

  let interval = setInterval(function(){

    // update percent
    percent += 1;
    document.getElementById("percent").innerText = percent + "%";

    // change funny text
    if(percent % 15 === 0 && textIndex < texts.length){
      document.getElementById("loadingText").innerText = texts[textIndex];
      textIndex++;
    }

    // finish at 100%
    if(percent >= 100){
      clearInterval(interval);
      document.getElementById("loading").style.display="none";
      document.getElementById("result").innerText="Your age is " + age;
      document.getElementById("popup").style.display="flex";
    }

  }, 90); // ~9 seconds total
}

function reset(){
  document.getElementById("popup").style.display="none";
  document.getElementById("age").value="";
  document.getElementById("percent").innerText="0%";
}

function shareTool(){
  if(navigator.share){
    navigator.share({
      title:"Age Testing Tool",
      text:"Try this funny age testing tool!",
      url:window.location.href
    });
  }else{
    alert("Copy this link: "+window.location.href);
  }
}
</script>

</body>
</html>
