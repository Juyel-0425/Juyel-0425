<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Downloader</title>
<style>
/* Reset */
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    padding: 20px; 
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    /* Prevents the body from scrolling itself if content slightly overflows */
    overflow-y: hidden; 
}

/* Header */
.header {
    line-height: 1.2;
    margin-bottom: 15px; /* Slight reduction for space */
}

.header h1 {
    font-size: 2.2em;
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

.header h2 {
    font-size: 0.75em; 
    color: #eee;
    font-weight: 300;
    margin-top: 5px;
}

/* Search container */
#search-container {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px; /* Slight reduction for space */
    flex-wrap: wrap;
}

#searchBox, #searchButton {
    border:none;
    outline:none;
    color: #333;
    background-color: white;
}

#searchBox {
    width: 60%;
    padding: 12px 15px;
    border-radius: 25px;
    font-size: 16px;
}

#searchButton {
    padding: 12px 15px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s;
}

#searchButton:hover { background-color: #eee; }

/* Main Content Wrapper (Optional, but helps with fixed positioning) */
#main-content {
    flex-grow: 1;
    overflow-y: auto; /* Allows content overflow within this section if needed */
    padding-bottom: 10px;
}

/* Results Container - Scrollable, Fixed Height */
#results {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 2px;
    margin-bottom: 8px; /* Further reduced margin to save space */
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    
    /* MODIFIED: Increased scrollable height to ensure 5 results fit comfortably and 
       combined height with player fits in viewport */
    max-height: 250px; 
    overflow-y: auto; 
    padding-right: 5px;
    background: rgba(0,0,0,0.1); 
    border-radius: 5px;
}

/* Song card */
.song-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(5px);
    border-radius: 5px;
    width: 100%;
    padding: 8px 15px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 54px; /* Slight height reduction */
    flex-shrink: 0;
}
.song-card:hover {
    transform: none;
    background: rgba(255,255,255,0.25);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.song-card img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 0;
    flex-shrink: 0;
}

.song-info { flex-grow: 1; overflow: hidden; white-space: nowrap; }
.song-card h3 { font-size: 1em; margin-bottom: 0; overflow: hidden; text-overflow: ellipsis; }
.song-card p { font-size: 0.8em; color: #ccc; overflow: hidden; text-overflow: ellipsis; }

/* Details section (The Player Container) - REDUCED LENGTH/HEIGHT */
#details {
    margin-top: 8px; /* Further reduced margin to save space */
    background: rgba(0,0,0,0.3);
    border-radius:15px;
    /* REDUCED vertical padding to decrease length/height */
    padding:15px 20px; 
    display:none;
    max-width: 800px; 
    margin-left:auto;
    margin-right:auto;
    transition: all 0.3s ease;
    margin-bottom: 0; /* Removed bottom margin */
}

/* Reduced image margin */
#details img {
    width:150px; /* Reduced image size slightly to save space */
    height:150px;
    border-radius:15px;
    object-fit:cover;
    display:block;
    margin:auto;
    margin-bottom: 10px; /* Reduced margin */
    transition: transform 0.3s;
}
#details img:hover { transform: scale(1.05); }

#details h2 { text-align:center; margin-bottom:5px; }
#details p { text-align:center; margin-bottom:10px; font-size:0.95em; color:#ddd; }
#details audio { width:100%; margin-bottom: 0; } /* Removed audio margin-bottom */

/* Download options */
#downloadOptions {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.quality-btn {
    padding:8px 15px;
    border:none;
    border-radius:25px;
    background: #ff416c;
    color:white;
    cursor:pointer;
    transition:0.3s;
}
.quality-btn:hover { background:#ff4b2b; }

/* Responsive */
@media(max-width:900px){
    #results, #details { max-width: 90%; } 
}
@media(max-width:768px){
    #searchBox { width:70%; }
}
@media(max-width:480px){
    #searchBox { width:80%; }
    .song-card { width:100%; }
}
</style>
</head>
<body>

<div class="header">
    <h1>MUSIC DOWNLOADER</h1>
    <h2>Music Downloader by Juyel Hossain | All music displayed here is provided by Jamendo API</h2>
</div>

<div id="search-container">
    <input type="text" id="searchBox" placeholder="Search for a song...">
    <button id="searchButton">🔎</button>
</div>

<div id="results"></div>

<div id="details">
    <img id="detail-img" src="" alt="Thumbnail">
    <h2 id="detail-title"></h2>
    <p id="detail-artist"></p>
    <audio id="player" controls></audio>
    <div id="downloadOptions"></div>
</div>

<script>
const clientId = "32482af0"; // Replace with your Jamendo API key

const searchButton = document.getElementById('searchButton');
const searchBox = document.getElementById('searchBox');
const resultsDiv = document.getElementById('results');
const detailsDiv = document.getElementById('details');
const detailImg = document.getElementById('detail-img');
const detailTitle = document.getElementById('detail-title');
const detailArtist = document.getElementById('detail-artist');
// REMOVED detailLyrics
const player = document.getElementById('player');
const downloadOptions = document.getElementById('downloadOptions');

searchButton.addEventListener('click', searchSong);
searchBox.addEventListener('keypress', e => { if(e.key==='Enter') searchSong(); });

async function searchSong(){
    const query = searchBox.value.trim();
    if(!query) return alert("Please enter a song name!");

    resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px;'>Loading...</p>";
    detailsDiv.style.display = 'none';

    const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${clientId}&format=json&limit=12&search=${encodeURIComponent(query)}`;

    try{
        const response = await fetch(url);
        const data = await response.json();
        resultsDiv.innerHTML = "";

        if(data.results.length===0){
            resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px;'>No songs found.</p>";
            return;
        }

        data.results.forEach(track => {
            const card = document.createElement('div');
            card.className = 'song-card';
            card.innerHTML = `
                <img src="${track.album_image}" alt="Thumbnail">
                <div class="song-info">
                    <h3>${track.name}</h3>
                    <p>${track.artist_name}</p>
                </div>
            `;
            card.onclick = () => showDetails(track);
            resultsDiv.appendChild(card);
        });

    }catch(err){
        console.error(err);
        resultsDiv.innerHTML = "<p style='text-align:center; padding: 10px;'>Error fetching songs.</p>";
    }
}

function showDetails(track){
    detailImg.src = track.album_image;
    detailTitle.textContent = track.name;
    detailArtist.textContent = "Artist: " + track.artist_name;
    // REMOVED detailLyrics assignment
    player.src = track.audio;

    downloadOptions.innerHTML = "";
    const qualities = [
        {label:'Standard', url: track.audio},
        {label:'High', url: track.audio},
        {label:'Low', url: track.audio}
    ];

    qualities.forEach(q=>{
        const btn = document.createElement('button');
        btn.className = 'quality-btn';
        btn.textContent = q.label;
        btn.onclick = () => window.open(q.url, '_blank');
        downloadOptions.appendChild(btn);
    });

    detailsDiv.style.display = 'block';
    // Removed window scroll since the player should be visible
}
</script>

</body>
</html>
