<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Downloader</title>
<style>
/* Reset */
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    padding: 20px 20px 0 20px; /* Adjusted padding to remove bottom padding for now */
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    
    /* NEW: Add padding to the bottom of the body equal to the footer's height + a little extra for visual space. */
    /* The footer's height is roughly 60-70px, so 80px ensures clearance. */
    padding-bottom: 80px; 
}

/* Header */
.header {
    line-height: 1.2;
    margin-bottom: 20px; /* Increased margin for better spacing */
}

.header h1 {
    font-size: 2.2em;
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

/* Removed .header h2 style as requested */

/* Search container */
#search-container {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

#searchBox, #searchButton {
    border:none;
    outline:none;
    color: #333; /* Changed text color for better contrast on white */
    background-color: white; /* Changed to white */
}

#searchBox {
    width: 60%;
    padding: 12px 15px;
    border-radius: 25px;
    font-size: 16px;
}

#searchButton {
    padding: 12px 15px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s;
}

#searchButton:hover { background-color: #eee; } /* Lighter hover for white button */

/* Results - Modified for thin horizontal rows */
#results {
    display: flex;
    flex-direction: column; /* Stack children vertically */
    justify-content: center;
    gap: 2px; /* 2px distinct between rows */
    /* REDUCED margin-bottom from 80px to 20px to bring the player closer to the results */
    margin-bottom: 20px; 
    max-width: 800px; /* Constrain results width */
    margin-left: auto;
    margin-right: auto;
}

/* Song card - Modified for thin horizontal row */
.song-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(5px);
    border-radius: 5px; /* Smaller border radius for thin row look */
    width: 100%; /* Full width within results container */
    padding: 8px 15px; /* Reduced padding for thin row */
    text-align: left; /* Align text left */
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    display: flex; /* Flex layout for content */
    align-items: center;
    gap: 15px;
}
.song-card:hover {
    transform: none; /* Removed scale for thin rows */
    background: rgba(255,255,255,0.25);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2); /* Subtle shadow for distinction */
}

.song-card img {
    width: 40px; /* Smaller thumbnail */
    height: 40px; /* Smaller thumbnail */
    border-radius: 50%; /* Circular thumbnail */
    object-fit: cover;
    margin-bottom: 0;
    flex-shrink: 0;
}
.song-card:hover img { transform: none; } /* Removed scale on hover */

.song-info {
    flex-grow: 1;
    overflow: hidden; /* Hide overflow */
    white-space: nowrap; /* Prevent wrapping */
}

.song-card h3 { 
    font-size: 1em; 
    margin-bottom: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}
.song-card p { 
    font-size: 0.8em; 
    color: #ccc; 
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Details section (The Player Container) */
#details {
    /* REDUCED margin-top from 30px to 10px to bring it closer to the results */
    margin-top: 10px; 
    background: rgba(0,0,0,0.3);
    border-radius:15px;
    padding:20px;
    display:none;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
    transition: all 0.3s ease;
    /* Added margin-bottom to push it away from the fixed footer area */
    margin-bottom: 10px; 
}
#details img {
    width:200px;
    height:200px;
    border-radius:15px;
    object-fit:cover;
    display:block;
    margin:auto;
    margin-bottom:15px;
    transition: transform 0.3s;
}
#details img:hover { transform: scale(1.05); }

#details h2 { text-align:center; margin-bottom:5px; }
#details p { text-align:center; margin-bottom:15px; font-size:0.95em; color:#ddd; }
#details audio { width:100%; margin-bottom:10px; }

/* Download options */
#downloadOptions {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.quality-btn {
    padding:8px 15px;
    border:none;
    border-radius:25px;
    background: #ff416c;
    color:white;
    cursor:pointer;
    transition:0.3s;
}
.quality-btn:hover { background:#ff4b2b; }

/* Footer - Fixed at bottom */
footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    /* REMOVED negative margin-bottom to avoid complexity, letting body padding handle clearance */
    background: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(6px);
    text-align: center;
    /* Adjusted padding for a clean look */
    padding: 10px 0; 
    font-size: 0.85em;
    color: #fff;
    transition: margin-bottom 0.3s ease; 
}

/* Responsive */
@media(max-width:768px){
    #searchBox { width:70%; }
}
@media(max-width:480px){
    #searchBox { width:80%; }
    .song-card { width:100%; }
}
</style>
</head>
<body>

<div class="header">
    <h1>MUSIC DOWNLOADER</h1>
    </div>

<div id="search-container">
    <input type="text" id="searchBox" placeholder="Search for a song...">
    <button id="searchButton">🔎</button>
</div>

<div id="results"></div>

<div id="details">
    <img id="detail-img" src="" alt="Thumbnail">
    <h2 id="detail-title"></h2>
    <p id="detail-artist"></p>
    <p id="detail-lyrics">Lyrics not available</p>
    <audio id="player" controls></audio>
    <div id="downloadOptions"></div>
</div>

<footer>
    Music Downloader by Juyel Hossain<br>
    All music displayed here is provided by Jamendo API
</footer>

<script>
const clientId = "32482af0"; // Replace with your Jamendo API key

const searchButton = document.getElementById('searchButton');
const searchBox = document.getElementById('searchBox');
const resultsDiv = document.getElementById('results');
const detailsDiv = document.getElementById('details');
const detailImg = document.getElementById('detail-img');
const detailTitle = document.getElementById('detail-title');
const detailArtist = document.getElementById('detail-artist');
const detailLyrics = document.getElementById('detail-lyrics');
const player = document.getElementById('player');
const downloadOptions = document.getElementById('downloadOptions');

searchButton.addEventListener('click', searchSong);
searchBox.addEventListener('keypress', e => { if(e.key==='Enter') searchSong(); });

async function searchSong(){
    const query = searchBox.value.trim();
    if(!query) return alert("Please enter a song name!");

    resultsDiv.innerHTML = "<p style='text-align:center;'>Loading...</p>";
    detailsDiv.style.display = 'none';

    const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${clientId}&format=json&limit=12&search=${encodeURIComponent(query)}`;

    try{
        const response = await fetch(url);
        const data = await response.json();
        resultsDiv.innerHTML = "";

        if(data.results.length===0){
            resultsDiv.innerHTML = "<p style='text-align:center;'>No songs found.</p>";
            return;
        }

        data.results.forEach(track => {
            const card = document.createElement('div');
            card.className = 'song-card';
            // Modified card innerHTML to support thin row layout
            card.innerHTML = `
                <img src="${track.album_image}" alt="Thumbnail">
                <div class="song-info">
                    <h3>${track.name}</h3>
                    <p>${track.artist_name}</p>
                </div>
            `;
            card.onclick = () => showDetails(track);
            resultsDiv.appendChild(card);
        });

    }catch(err){
        console.error(err);
        resultsDiv.innerHTML = "<p style='text-align:center;'>Error fetching songs.</p>";
    }
}

function showDetails(track){
    detailImg.src = track.album_image;
    detailTitle.textContent = track.name;
    detailArtist.textContent = "Artist: " + track.artist_name;
    detailLyrics.textContent = "Lyrics not available";
    player.src = track.audio;

    downloadOptions.innerHTML = "";
    const qualities = [
        {label:'Standard', url: track.audio},
        {label:'High', url: track.audio},
        {label:'Low', url: track.audio}
    ];

    qualities.forEach(q=>{
        const btn = document.createElement('button');
        btn.className = 'quality-btn';
        btn.textContent = q.label;
        btn.onclick = () => window.open(q.url, '_blank');
        downloadOptions.appendChild(btn);
    });

    detailsDiv.style.display = 'block';
    window.scrollTo({top: detailsDiv.offsetTop-20, behavior:'smooth'});
}
</script>

</body>
</html>
