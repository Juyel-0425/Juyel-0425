<!DOCTYPE html>
<html>
<head>
  <title>MAXIMUM Browser Stress Test</title>
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #txt {
      position:fixed;
      top:10px; left:10px;
      color:red;
      font-family:monospace;
      z-index:10;
    }
  </style>
</head>
<body>
<div id="txt">MAX STRESS — CLOSE TAB IF HOT</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ---------- BASIC SETUP ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(100, innerWidth/innerHeight, 0.1, 2000);
camera.position.z = 40;

/* ---------- EXTREME RENDERER ---------- */
const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance"
});

// INTERNAL 4K+ RENDER BUFFER
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio * 3, 4));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ---------- LIGHT FLOOD ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.1));
for (let i = 0; i < 25; i++) {
  const l = new THREE.PointLight(0xffffff, 3, 200);
  l.position.set(
    Math.random()*150-75,
    Math.random()*150-75,
    Math.random()*150-75
  );
  l.castShadow = true;
  l.shadow.mapSize.set(4096,4096);
  scene.add(l);
}

/* ---------- SHADER THAT BURNS GPU ---------- */
const material = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    varying vec3 vPos;
    void main(){
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vPos;
    uniform float time;

    void main(){
      vec3 p = vPos;
      float c = 0.0;
      for(int i=0;i<120;i++){
        p = abs(p) / dot(p,p) - 0.7;
        c += length(p);
      }
      gl_FragColor = vec4(vec3(c * 0.015), 1.0);
    }
  `
});

/* ---------- INSANE GEOMETRY COUNT ---------- */
const geo = new THREE.IcosahedronGeometry(1, 6);
const meshes = [];
const COUNT = 1200;

for (let i = 0; i < COUNT; i++) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(
    Math.random()*120-60,
    Math.random()*120-60,
    Math.random()*120-60
  );
  scene.add(m);
  meshes.push(m);
}

/* ---------- CPU STRESS ---------- */
function cpuBurn() {
  let x = 0;
  for (let i = 0; i < 8e6; i++) {
    x += Math.sqrt(i) * Math.sin(i);
  }
  return x;
}

/* ---------- MULTI-PASS RENDER ---------- */
function animate(t) {
  requestAnimationFrame(animate);
  material.uniforms.time.value = t * 0.001;

  meshes.forEach((m,i)=>{
    m.rotation.x += 0.01;
    m.rotation.y += 0.02;
  });

  cpuBurn(); // CPU choke

  // Render same frame multiple times (fill-rate killer)
  renderer.render(scene, camera);
  renderer.render(scene, camera);
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
